name: Testes de permissão do banco

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-db:
    name: Migrations + RLS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Sobe um Postgres no Docker, aplica todas as migrations e roda supabase/tests/10_permissions.sql
      - run: bash scripts/test-db.sh
